name: Release

# Builds the Claude Desktop bundle from a version tag, signs it with Sigstore
# (keyless, bound to this repository's GitHub identity), attaches SLSA build
# provenance and publishes a GitHub release. Nothing is built on a laptop and
# nothing is fetched with `npx -y` at runtime: the bundle is a fixed artifact
# that users install by absolute path.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write      # create the release and upload assets
  id-token: write      # Sigstore keyless signing + provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check that the tag matches package.json and manifest.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          MAN="$(node -p "require('./manifest.json').version")"
          echo "tag=$TAG package.json=$PKG manifest.json=$MAN"
          [ "$TAG" = "$PKG" ] && [ "$TAG" = "$MAN" ] || { echo "version mismatch"; exit 1; }

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle

      - name: Checksums and Sigstore signature
        working-directory: release
        run: |
          sha256sum bamboohr-mcp.mcpb > SHA256SUMS
          cosign sign-blob --yes --bundle bamboohr-mcp.mcpb.sigstore.json bamboohr-mcp.mcpb
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/bamboohr-mcp.mcpb

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(mktemp)"
          # Release notes: the CHANGELOG section for this version, if present.
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[?"v"\\]?" {p=1; next}
            /^## / {if (p) exit}
            p' CHANGELOG.md > "$NOTES" || true
          cat >> "$NOTES" <<'TXT'

          ### Verify the download

          ```sh
          sha256sum -c SHA256SUMS
          cosign verify-blob --bundle bamboohr-mcp.mcpb.sigstore.json \
            --certificate-identity-regexp '^https://github.com/mikkmihkel/bamboohr-mcp/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            bamboohr-mcp.mcpb
          gh attestation verify bamboohr-mcp.mcpb --repo mikkmihkel/bamboohr-mcp
          ```
          TXT
          gh release create "$GITHUB_REF_NAME" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file "$NOTES" \
            --verify-tag \
            release/bamboohr-mcp.mcpb \
            release/bamboohr-mcp.mcpb.sigstore.json \
            release/SHA256SUMS \
            release/SHA256SUMS.sigstore.json
